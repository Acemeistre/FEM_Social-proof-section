<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->
  <link href="styles.css" rel="stylesheet" type="text/css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social proof section</title>


</head>

<body>
  <main>
    <div class="top">
      <section class="intro">
        <h1 class="banner-header">10,000+ of our users love our products.</h1>
        <p class="banner-text">We only provide great products combined with excellent customer service.
          See what our satisfied customers are saying about our services.</p>
      </section>
      <ul class="ratings">
        <li class="rating">
          <div class="stars">
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
          </div>
          <p class="rating-info">Rated 5 Stars in Reviews</p>
        </li>
        <li class="rating">
          <div class="stars">
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
          </div>
          <p class="rating-info">Rated 5 Stars in Report Guru</p>
        </li>
        <li class="rating">
          <div class="stars">
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
            <img src="./images/icon-star.svg" alt="" />
          </div>
          <p class="rating-info">Rated 5 Stars in BestTech</p>
        </li>
      </ul>
    </div>
    <section class="reviews">
      <h2 class="visually-hidden">Customer reviews</h2>
      <figure class="review">
        <figcaption class="author">
          <img src="./images/image-colton.jpg" alt="avatar of Colton Smith" />
          <p class="name">Colton Smith</p>
          <p class="status">Verified Buyer</p>
        </figcaption>
        <blockquote>
          <p>We needed the same printed design as the one we had ordered a week prior.
            Not only did they find the original order, but we also received it in time.
            Excellent!</p>
        </blockquote>
      </figure>
      <figure class="review">
        <figcaption class="author">
          <img src="./images/image-irene.jpg" alt="avatar of Irene Roberts" />
          <p class="name">Irene Roberts</p>
          <p class="status">Verified Buyer</p>
        </figcaption>
        <blockquote>
          <p>Customer service is always excellent and very quick turn around. Completely
            delighted with the simplicity of the purchase and the speed of delivery.</p>
        </blockquote>
      </figure>
      <figure class="review">
        <figcaption class="author">
          <img src="./images/image-anne.jpg" alt="avatar of Anne Wallace" />
          <p class="name">Anne Wallace</p>
          <p class="status">Verified Buyer</p>
        </figcaption>
        <blockquote>
          <p>Put an order with this company and can only praise them for the very high
            standard. Will definitely use them again and recommend them to everyone!</p>
        </blockquote>
      </figure>
    </section>
  </main>
</body>

</html>
